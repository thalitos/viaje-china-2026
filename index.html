<style>
:root{--ground:#EDF0EF;--surface:#FFF;--ink:#14211F;--ink2:#41514E;--ink3:#71827E;--line:#D5DEDB;--city:#15756B;--alerta:#C63B26}
@media (prefers-color-scheme:dark){:root{--ground:#0D1514;--surface:#151F1D;--ink:#E4EBE8;--ink2:#A9B8B4;--ink3:#7C8C88;--line:#26332F;--city:#4CC3B2;--alerta:#F4816B}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  display:grid;place-items:center;padding:24px;-webkit-text-size-adjust:100%}
.gate{width:100%;max-width:380px;text-align:center}
.mark{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink3)}
h1{font-family:"Newsreader",Georgia,serif;font-weight:600;font-size:32px;line-height:1.12;
  letter-spacing:-.015em;margin:10px 0 6px;text-wrap:balance}
.sub{color:var(--ink2);font-size:14px;line-height:1.5}
form{margin-top:26px;display:flex;flex-direction:column;gap:10px}
input[type=password]{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:14px 15px;font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:16px;color:var(--ink);text-align:center}
input[type=password]:focus{outline:none;border-color:var(--city)}
button{appearance:none;border:0;border-radius:12px;background:var(--city);color:#fff;padding:14px;
  font-family:inherit;font-size:15px;font-weight:600;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
.remember{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--ink3);font-size:13px;margin-top:2px}
.remember input{accent-color:var(--city);width:16px;height:16px}
.err{color:var(--alerta);font-size:13px;min-height:19px;margin-top:4px}
.foot{margin-top:30px;color:var(--ink3);font-size:11.5px;line-height:1.6}
</style>
</head>
<body>
<main class="gate">
  <div class="mark">22 ago — 5 sep 2026</div>
  <h1>Quince días en China</h1>
  <p class="sub">Guía privada del viaje. Introduce la contraseña para abrirla.</p>
  <form id="f">
    <input type="password" id="p" autocomplete="current-password" placeholder="Contraseña" autofocus>
    <button type="submit" id="b">Abrir la guía</button>
    <label class="remember"><input type="checkbox" id="r" checked> Recordar en este dispositivo</label>
  </form>
  <div class="err" id="e"></div>
  <div class="foot">El contenido está cifrado con AES-256 en el propio fichero.<br>Sin la contraseña no hay nada que leer aquí.</div>
</main>

<script>
(function(){
  var D = JSON.parse(document.getElementById("pl").textContent);
  var f = document.getElementById("f"), p = document.getElementById("p"),
      b = document.getElementById("b"), e = document.getElementById("e"), r = document.getElementById("r");
  function bin(s){ var x = atob(s), a = new Uint8Array(x.length); for(var i=0;i<x.length;i++) a[i]=x.charCodeAt(i); return a; }
  function open_(pw, silent){
    b.disabled = true; e.textContent = silent ? "" : "Descifrando…";
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"])
      .then(function(k){ return crypto.subtle.deriveKey({name:"PBKDF2", salt:bin(D.s), iterations:D.n, hash:"SHA-256"},
              k, {name:"AES-GCM", length:256}, false, ["decrypt"]); })
      .then(function(k){ return crypto.subtle.decrypt({name:"AES-GCM", iv:bin(D.i)}, k, bin(D.c)); })
      .then(function(buf){
        var html = new TextDecoder().decode(buf);
        if(r.checked){ try{ localStorage.setItem("cn26-pw", pw); }catch(x){} }
        document.open(); document.write(html); document.close();
      })
      .catch(function(){
        b.disabled = false;
        try{ localStorage.removeItem("cn26-pw"); }catch(x){}
        if(!silent){ e.textContent = "Esa contraseña no es. Inténtalo otra vez."; p.select(); }
        else e.textContent = "";
      });
  }
  f.onsubmit = function(ev){ ev.preventDefault(); if(p.value) open_(p.value, false); };
  var saved = null; try{ saved = localStorage.getItem("cn26-pw"); }catch(x){}
  if(saved) open_(saved, true);
})();
</script>
